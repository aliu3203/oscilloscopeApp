[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oscilloscope-capture"
version = "0.1.0"
description = "Siglent SDS1000X-E driver, storage helpers and client for the Oscilloscope Capture app's local API"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["scope"]
